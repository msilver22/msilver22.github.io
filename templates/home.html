{% extends 'base.html' %}
{% block content %}
<section class="hero enter">
  <h1>{{ site.tagline }}</h1>
  <div class="bio">{{ bio }}</div>
  <a class="text-link" href="/publications/">Publications <span aria-hidden="true">↗</span></a>
</section>
<section class="news-section reveal" aria-labelledby="news-title">
  <div class="section-heading"><h2 id="news-title">News</h2><a class="text-link" href="/news/">All news ↗</a></div>
  {% with entries=news[:site.news_limit] %}{% include 'news-list.html' %}{% endwith %}
</section>
{% endblock %}
