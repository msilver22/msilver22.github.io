{% extends 'base.html' %}
{% block content %}
<header class="page-heading enter"><h1>News</h1></header>
{% for group in news|groupby('date.year')|reverse %}<section class="news-section reveal"><div class="section-heading"><h2>{{ group.grouper }}</h2><span class="eyebrow">{{ group.list|length }} updates</span></div>{% with entries=group.list %}{% include 'news-list.html' %}{% endwith %}</section>{% endfor %}
{% endblock %}
